name: 缺陷反馈
description: 反馈可复现的 ZhuaTech MDM 问题
title: "[Bug] "
body:
  - type: markdown
    attributes: {value: "请勿填写真实客户、供应商、联系人、采购价格、合同或访问密钥。"}
  - type: textarea
    id: description
    attributes: {label: 问题描述, description: 说明预期行为与实际行为}
    validations: {required: true}
  - type: textarea
    id: steps
    attributes: {label: 复现步骤}
    validations: {required: true}
  - type: input
    id: version
    attributes: {label: 版本与运行环境}
